name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lean Audit & Empirical Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Limit the normal Lean/Lake thread pool on the hosted runner.
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean toolchain
        run: |
          TOOLCHAIN=$(cat lean-toolchain | tr -d '[:space:]')
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"

      - name: Verify build tools
        run: |
          rg --version
          lake --version
          lean --version
          python3 --version
          c++ --version
          make --version

      # These large kernel-checked trace certificates otherwise compile at once.
      # Warm them sequentially; make test still verifies the entire project.
      - name: Build deep trace certificates sequentially
        run: |
          python3 scripts/ci_with_resources.py /usr/bin/time -v lake build Recaman.DeepNineteenTraceCertificate
          python3 scripts/ci_with_resources.py /usr/bin/time -v lake build Recaman.DeepSixtyoneTraceCertificate

      - name: Run complete test and verification suite
        run: |
          python3 scripts/ci_with_resources.py make test

      - name: Report runner resources on failure
        if: failure()
        run: |
          free -h
          df -h
          ps -eo pid,ppid,stat,rss,etime,comm --sort=-rss | sed -n '1,25p'
