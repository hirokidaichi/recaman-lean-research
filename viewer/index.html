<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recamán 人間向け証明ビューワー</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --panel2: #1b2030;
    --border: #2a3145;
    --text: #d7dce8;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --accent2: #f0b429;
    --green: #4cc38a;
    --red: #e5484d;
    --code-bg: #10131c;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .stats { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { border-color: var(--accent); }

  #layout { flex: 1 1 auto; display: flex; min-height: 0; }

  /* ---- sidebar ---- */
  #sidebar {
    width: 250px;
    flex: 0 0 auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #search {
    margin: 10px;
    padding: 7px 10px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #modlist { flex: 1; overflow-y: auto; padding: 0 6px 12px; }
  .modItem {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    font-size: 12.5px;
    white-space: nowrap;
  }
  .modItem:hover { background: var(--panel2); }
  .modItem.active { background: #24304d; color: #fff; }
  .modItem .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .dot.ok { background: var(--green); }
  .dot.pending { background: var(--red); }
  .modItem .meta { margin-left: auto; color: var(--muted); font-size: 10.5px; }
  .sectionLabel {
    padding: 10px 10px 4px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .08em;
  }
  .modItem.special { font-weight: 600; color: var(--accent2); }

  /* ---- panes ---- */
  #panes { flex: 1; display: flex; min-width: 0; }
  .pane {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .pane + .pane { border-left: 1px solid var(--border); }
  .paneHead {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 14px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .paneHead b { color: var(--text); font-weight: 600; }
  .paneBody { flex: 1; overflow: auto; min-height: 0; }

  /* ---- markdown ---- */
  #reportBody { padding: 20px 28px 60px; max-width: 860px; line-height: 1.85; }
  #reportBody h1 { font-size: 21px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  #reportBody h2 { font-size: 17px; margin-top: 2em; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
  #reportBody h3 { font-size: 14.5px; margin-top: 1.8em; color: var(--accent); }
  #reportBody h4 { font-size: 13.5px; margin-top: 1.4em; }
  #reportBody code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  #reportBody pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    line-height: 1.55;
  }
  #reportBody pre code { background: none; border: none; padding: 0; }
  #reportBody blockquote {
    margin: 1em 0;
    padding: 2px 16px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  #reportBody table { border-collapse: collapse; margin: 1em 0; font-size: 12.5px; display: block; overflow-x: auto; }
  #reportBody th, #reportBody td { border: 1px solid var(--border); padding: 5px 10px; }
  #reportBody th { background: var(--panel2); }
  #reportBody a { color: var(--accent); text-decoration: none; }
  #reportBody a:hover { text-decoration: underline; }
  a.ljump {
    font-family: var(--mono);
    font-size: 11px;
    background: #24304d;
    border-radius: 10px;
    padding: 2px 9px;
    margin-left: 6px;
    cursor: pointer;
    color: var(--accent) !important;
    vertical-align: 2px;
  }
  a.ljump:hover { background: #2d3b5e; text-decoration: none !important; }

  /* ---- lean source ---- */
  #leanBody { font-family: var(--mono); font-size: 12px; line-height: 1.6; padding: 10px 0 60px; }
  .lline { display: flex; }
  .lline:hover { background: #171c28; }
  .lline.hl { background: #2b3a2e; outline: 1px solid var(--green); }
  .lline .ln {
    flex: 0 0 52px;
    text-align: right;
    padding-right: 14px;
    color: #4a5268;
    user-select: none;
  }
  .lline .lc { white-space: pre; padding-right: 20px; }
  .tok-kw { color: #c792ea; }
  .tok-decl { color: #82aaff; font-weight: 600; }
  .tok-tactic { color: #89ddff; }
  .tok-comment { color: #5f6b85; font-style: italic; }
  .tok-doc { color: #7d8db3; font-style: italic; }
  .tok-str { color: #c3e88d; }
  .tok-num { color: #f78c6c; }
  .tok-attr { color: #f0b429; }

  .placeholder { padding: 40px; color: var(--muted); text-align: center; line-height: 2; }
  .spin { display:inline-block; animation: rot 1.2s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  #declToc {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11.5px;
    max-width: 320px;
    padding: 3px 6px;
  }
</style>
</head>
<body>
<header>
  <h1>Recamán 人間向け証明ビューワー</h1>
  <span class="stats" id="stats">読み込み中…</span>
  <span class="spacer"></span>
  <button id="reloadBtn" title="レポートの生成状況を再確認">↻ 生成状況を更新</button>
</header>
<div id="layout">
  <nav id="sidebar">
    <input id="search" type="search" placeholder="モジュール検索…">
    <div id="modlist"></div>
  </nav>
  <div id="panes">
    <section class="pane">
      <div class="paneHead">📖 <b>日本語レポート</b> <span id="reportStatus"></span></div>
      <div class="paneBody"><div id="reportBody"></div></div>
    </section>
    <section class="pane">
      <div class="paneHead">🧮 <b>Lean 証明</b>
        <select id="declToc"><option value="">— 宣言へジャンプ —</option></select>
        <span id="leanStatus"></span>
      </div>
      <div class="paneBody" id="leanScroll"><div id="leanBody"></div></div>
    </section>
  </div>
</div>

<script>
"use strict";

const state = { manifest: null, current: null, reportReady: {} };

/* ---------------- markdown renderer ---------------- */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineMd(s) {
  let out = "";
  // split by code spans first so we don't format inside them
  const parts = s.split(/(`[^`]*`)/);
  for (const p of parts) {
    if (p.startsWith("`") && p.endsWith("`") && p.length >= 2) {
      out += "<code>" + esc(p.slice(1, -1)) + "</code>";
    } else {
      let t = esc(p);
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
      t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, a, b) => {
        if (/^https?:/.test(b)) return `<a href="${b}" target="_blank" rel="noopener">${a}</a>`;
        if (b.startsWith("#/")) return `<a href="${b}">${a}</a>`;
        return a;
      });
      out += t;
    }
  }
  // (L42) → jump chip
  out = out.replace(/\((L(\d+)(?:[-–]L?\d+)?)\)/g,
    (m, label, line) => ` <a class="ljump" data-line="${line}">${label}</a>`);
  return out;
}
function renderMd(md) {
  const lines = md.split("\n");
  let html = "", i = 0;
  let inList = null; // "ul" | "ol"
  const closeList = () => { if (inList) { html += `</${inList}>`; inList = null; } };
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith("```")) {
      closeList();
      let code = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) { code.push(lines[i]); i++; }
      i++;
      html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      closeList();
      const lvl = h[1].length;
      html += `<h${lvl}>${inlineMd(h[2])}</h${lvl}>`;
      i++; continue;
    }
    const grabItem = (first) => {
      let item = [first];
      i++;
      while (i < lines.length && /^\s{2,}\S/.test(lines[i]) &&
             !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])) {
        item.push(lines[i].trim()); i++;
      }
      return item.join(" ");
    };
    if (/^\s*[-*]\s+/.test(line)) {
      if (inList !== "ul") { closeList(); html += "<ul>"; inList = "ul"; }
      html += "<li>" + inlineMd(grabItem(line.replace(/^\s*[-*]\s+/, ""))) + "</li>";
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      if (inList !== "ol") { closeList(); html += "<ol>"; inList = "ol"; }
      html += "<li>" + inlineMd(grabItem(line.replace(/^\s*\d+\.\s+/, ""))) + "</li>";
      continue;
    }
    if (/^\s*>/.test(line)) {
      closeList();
      let quote = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        quote.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      html += "<blockquote>" + renderMd(quote.join("\n")) + "</blockquote>";
      continue;
    }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      closeList();
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\s*\||\|\s*$/g, "").split("|").map(c => c.trim());
      html += "<table><thead><tr>" +
        cells(rows[0]).map(c => `<th>${inlineMd(c)}</th>`).join("") + "</tr></thead><tbody>";
      for (let r = 2; r < rows.length; r++) {
        html += "<tr>" + cells(rows[r]).map(c => `<td>${inlineMd(c)}</td>`).join("") + "</tr>";
      }
      html += "</tbody></table>";
      continue;
    }
    if (line.trim() === "---" || line.trim() === "***") { closeList(); html += "<hr>"; i++; continue; }
    if (line.trim() === "") { closeList(); i++; continue; }
    closeList();
    let para = [];
    while (i < lines.length && lines[i].trim() !== "" &&
           !/^(#{1,6}\s|```|\s*[-*]\s|\s*\d+\.\s|\s*>|\s*\|)/.test(lines[i]) &&
           lines[i].trim() !== "---") {
      para.push(lines[i]); i++;
    }
    html += "<p>" + inlineMd(para.join(" ")) + "</p>";
  }
  closeList();
  return html;
}

/* ---------------- lean highlighter ---------------- */
const LEAN_DECL = new Set(["theorem", "lemma", "def", "structure", "inductive", "abbrev",
  "instance", "class", "example", "namespace", "end", "import", "open", "section", "variable"]);
const LEAN_KW = new Set(["by", "with", "at", "fun", "let", "match", "where", "do", "if",
  "then", "else", "from", "have", "show", "calc", "this", "deriving", "extends", "mutual",
  "termination_by", "decreasing_by"]);
const LEAN_TACTIC = new Set(["intro", "intros", "exact", "apply", "cases", "rcases", "obtain",
  "constructor", "refine", "simp", "omega", "decide", "rfl", "rw", "rewrite", "unfold",
  "induction", "by_cases", "by_contra", "push_neg", "contradiction", "exfalso", "left",
  "right", "use", "exists", "specialize", "subst", "trivial", "assumption", "norm_num",
  "ring", "linarith", "nlinarith", "positivity", "field_simp", "aesop", "tauto", "and_intros"]);

function highlightLean(src) {
  const out = [];
  let inBlockComment = 0, blockIsDoc = false;
  const lines = src.split("\n");
  for (const line of lines) {
    let html = "", j = 0;
    while (j < line.length) {
      if (inBlockComment > 0) {
        const close = line.indexOf("-/", j);
        const openN = line.indexOf("/-", j);
        if (openN !== -1 && (close === -1 || openN < close)) {
          html += `<span class="${blockIsDoc ? "tok-doc" : "tok-comment"}">${esc(line.slice(j, openN + 2))}</span>`;
          inBlockComment++; j = openN + 2; continue;
        }
        if (close === -1) {
          html += `<span class="${blockIsDoc ? "tok-doc" : "tok-comment"}">${esc(line.slice(j))}</span>`;
          j = line.length;
        } else {
          html += `<span class="${blockIsDoc ? "tok-doc" : "tok-comment"}">${esc(line.slice(j, close + 2))}</span>`;
          j = close + 2;
          inBlockComment--;
          if (inBlockComment === 0) blockIsDoc = false;
        }
        continue;
      }
      const rest = line.slice(j);
      let m;
      if ((m = rest.match(/^--.*$/))) {
        html += `<span class="tok-comment">${esc(m[0])}</span>`; j = line.length; continue;
      }
      if ((m = rest.match(/^\/-[-!]?/))) {
        inBlockComment = 1;
        blockIsDoc = m[0] !== "/-" || rest.startsWith("/--") || rest.startsWith("/-!");
        html += `<span class="${blockIsDoc ? "tok-doc" : "tok-comment"}">${esc(m[0])}</span>`;
        j += m[0].length; continue;
      }
      if ((m = rest.match(/^"(?:[^"\\]|\\.)*"/))) {
        html += `<span class="tok-str">${esc(m[0])}</span>`; j += m[0].length; continue;
      }
      if ((m = rest.match(/^@\[[^\]]*\]/))) {
        html += `<span class="tok-attr">${esc(m[0])}</span>`; j += m[0].length; continue;
      }
      if ((m = rest.match(/^[A-Za-z_][A-Za-z0-9_'!?]*/))) {
        const w = m[0];
        let cls = null;
        if (LEAN_DECL.has(w)) cls = "tok-decl";
        else if (LEAN_KW.has(w)) cls = "tok-kw";
        else if (LEAN_TACTIC.has(w)) cls = "tok-tactic";
        html += cls ? `<span class="${cls}">${esc(w)}</span>` : esc(w);
        j += w.length; continue;
      }
      if ((m = rest.match(/^\d+/))) {
        html += `<span class="tok-num">${m[0]}</span>`; j += m[0].length; continue;
      }
      html += esc(line[j]); j++;
    }
    out.push(html);
  }
  return out;
}

/* ---------------- data loading ---------------- */
async function loadManifest() {
  const res = await fetch("manifest.json", { cache: "no-store" });
  state.manifest = await res.json();
}

async function probeReports() {
  const mods = state.manifest.modules;
  const chunks = [];
  for (let i = 0; i < mods.length; i += 12) chunks.push(mods.slice(i, i + 12));
  for (const chunk of chunks) {
    await Promise.all(chunk.map(async m => {
      try {
        const r = await fetch(`../docs/human-proofs/${m.name}.md`, { method: "HEAD", cache: "no-store" });
        state.reportReady[m.name] = r.ok;
      } catch { state.reportReady[m.name] = false; }
    }));
  }
  renderSidebar();
  updateStats();
}

function updateStats() {
  const total = state.manifest.total;
  const ready = Object.values(state.reportReady).filter(Boolean).length;
  document.getElementById("stats").textContent =
    `全${total}モジュール / 日本語レポート ${ready}件 生成済み`;
}

/* ---------------- sidebar ---------------- */
function renderSidebar() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = document.getElementById("modlist");
  list.innerHTML = "";

  const mkItem = (label, cls, onclick, dotCls, meta) => {
    const div = document.createElement("div");
    div.className = "modItem" + (cls ? " " + cls : "");
    if (dotCls) {
      const dot = document.createElement("span");
      dot.className = "dot " + dotCls;
      div.appendChild(dot);
    }
    const span = document.createElement("span");
    span.textContent = label;
    span.style.overflow = "hidden";
    span.style.textOverflow = "ellipsis";
    div.appendChild(span);
    if (meta) {
      const ms = document.createElement("span");
      ms.className = "meta";
      ms.textContent = meta;
      div.appendChild(ms);
    }
    div.onclick = onclick;
    list.appendChild(div);
    return div;
  };

  if (!q) {
    const label = document.createElement("div");
    label.className = "sectionLabel";
    label.textContent = "レポート";
    list.appendChild(label);
    const it = mkItem("📋 洗い出しレポート(総覧)", "special", () => { location.hash = "#/"; }, null, null);
    if (!state.current) it.classList.add("active");
  }

  const label2 = document.createElement("div");
  label2.className = "sectionLabel";
  label2.textContent = "モジュール (" + state.manifest.total + ")";
  list.appendChild(label2);

  for (const m of state.manifest.modules) {
    if (q && !m.name.toLowerCase().includes(q)) continue;
    const ready = state.reportReady[m.name] ?? m.hasReport;
    const it = mkItem(m.name, null,
      () => { location.hash = "#/module/" + m.name; },
      ready ? "ok" : "pending",
      `${m.theorems}thm·${m.lines}L`);
    if (state.current === m.name) it.classList.add("active");
  }
}

/* ---------------- views ---------------- */
function setReportHtml(html) {
  const el = document.getElementById("reportBody");
  el.innerHTML = html;
  el.querySelectorAll("a.ljump").forEach(a => {
    a.onclick = () => jumpToLine(parseInt(a.dataset.line, 10));
  });
  el.parentElement.scrollTop = 0;
}

async function showSurvey() {
  state.current = null;
  renderSidebar();
  document.getElementById("reportStatus").textContent = "docs/human-proofs/README.md";
  try {
    const res = await fetch("../docs/human-proofs/README.md", { cache: "no-store" });
    if (!res.ok) throw new Error();
    setReportHtml(renderMd(await res.text()));
  } catch {
    setReportHtml(`<div class="placeholder">洗い出しレポート(README.md)がまだ生成されていません。</div>`);
  }
  document.getElementById("leanBody").innerHTML =
    `<div class="placeholder" style="font-family:inherit">左のリストからモジュールを選ぶと、<br>ここに Lean ソースが表示されます。</div>`;
  document.getElementById("leanStatus").textContent = "";
  fillDeclToc(null);
}

async function showModule(name) {
  state.current = name;
  renderSidebar();
  const mod = state.manifest.modules.find(m => m.name === name);
  if (!mod) return showSurvey();

  // report pane
  document.getElementById("reportStatus").textContent = `docs/human-proofs/${name}.md`;
  try {
    const res = await fetch(`../docs/human-proofs/${name}.md`, { cache: "no-store" });
    if (!res.ok) throw new Error();
    state.reportReady[name] = true;
    setReportHtml(renderMd(await res.text()));
  } catch {
    state.reportReady[name] = false;
    setReportHtml(`<div class="placeholder"><span class="spin">⏳</span><br>
      <b>${esc(name)}</b> の日本語レポートはまだ生成中です。<br>
      しばらくしてから右上の「生成状況を更新」を押してください。</div>`);
  }

  // lean pane
  document.getElementById("leanStatus").textContent = `Recaman/${name}.lean (${mod.lines}行)`;
  try {
    const res = await fetch(`../Recaman/${name}.lean`, { cache: "no-store" });
    const src = await res.text();
    const hl = highlightLean(src);
    const body = document.getElementById("leanBody");
    body.innerHTML = hl.map((h, idx) =>
      `<div class="lline" id="L${idx + 1}"><span class="ln">${idx + 1}</span><span class="lc">${h || "&nbsp;"}</span></div>`
    ).join("");
    document.getElementById("leanScroll").scrollTop = 0;
  } catch {
    document.getElementById("leanBody").innerHTML =
      `<div class="placeholder">Recaman/${esc(name)}.lean を読み込めませんでした。</div>`;
  }
  fillDeclToc(mod);
  updateStats();
}

function fillDeclToc(mod) {
  const sel = document.getElementById("declToc");
  sel.innerHTML = `<option value="">— 宣言へジャンプ —</option>`;
  if (!mod) return;
  for (const d of mod.decls) {
    const opt = document.createElement("option");
    opt.value = d.line;
    opt.textContent = `${d.kind} ${d.name} (L${d.line})`;
    sel.appendChild(opt);
  }
}

function jumpToLine(line) {
  const el = document.getElementById("L" + line);
  if (!el) return;
  document.querySelectorAll(".lline.hl").forEach(e => e.classList.remove("hl"));
  el.classList.add("hl");
  const sc = document.getElementById("leanScroll");
  const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top +
    sc.scrollTop - sc.clientHeight / 2;
  sc.scrollTop = Math.max(0, top);
}

/* ---------------- routing ---------------- */
function route() {
  const h = location.hash;
  const m = h.match(/^#\/module\/([A-Za-z0-9_]+)/);
  if (m) showModule(m[1]);
  else showSurvey();
}

document.getElementById("search").addEventListener("input", renderSidebar);
document.getElementById("reloadBtn").addEventListener("click", async () => {
  await probeReports();
  if (state.current && !state.reportReady[state.current]) showModule(state.current);
  else if (state.current) showModule(state.current);
});
document.getElementById("declToc").addEventListener("change", e => {
  if (e.target.value) jumpToLine(parseInt(e.target.value, 10));
});
window.addEventListener("hashchange", route);

(async function init() {
  await loadManifest();
  renderSidebar();
  updateStats();
  route();
  probeReports();
})();
</script>
</body>
</html>
